# Runs the full UI suite headless in Chrome and Firefox:
#   - on every push and pull request to main
#   - every night at 02:00 UTC, so a fresh report is waiting in the morning
#   - on demand from the Actions tab
# The Robot Framework reports are uploaded as downloadable artifacts.
name: UI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false          # finish every browser even if one fails
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python run_tests.py --browser ${{ matrix.browser }} --headless

      - name: Upload Robot Framework report
        if: always()            # upload the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: robot-report-${{ matrix.browser }}
          path: results/${{ matrix.browser }}
